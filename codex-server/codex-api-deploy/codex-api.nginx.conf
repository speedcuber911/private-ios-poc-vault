# Example rendered nginx config. Prefer generating an owner-specific config with:
#   ops/render-codex-api-config
#
# Keep the subject strings exactly aligned with CODEX_ALLOWED_CERT_SUBJECTS in
# /etc/codex-api.env.
map $ssl_client_verify $codex_client_verified {
    default 0;
    SUCCESS 1;
}

map $ssl_client_s_dn $codex_client_subject_allowed {
    default 0;
    "CN=iphone" 1;
    "CN=parikshit-mac" 1;
}

server {
    listen 443 ssl;
    server_name codex.pocs.example.com;

    ssl_certificate /etc/poc-vault/tls/server.crt;
    ssl_certificate_key /etc/poc-vault/tls/server.key;

    # Client certs are optional at the TLS layer so /healthz can stay public.
    # Every /v1/codex route below enforces SUCCESS plus an exact subject allowlist.
    ssl_client_certificate /etc/codex-api/mtls/client-ca.crt;
    ssl_crl /etc/codex-api/mtls/client-crl.pem;
    ssl_verify_client optional;
    ssl_verify_depth 2;

    client_max_body_size 30m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control no-store always;

    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:8787/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /v1/codex/ {
        if ($codex_client_verified = 0) {
            return 403;
        }

        if ($codex_client_subject_allowed = 0) {
            return 403;
        }

        proxy_http_version 1.1;
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-S-DN $ssl_client_s_dn;
    }

    location / {
        return 404;
    }
}
